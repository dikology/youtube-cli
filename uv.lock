    { name = "pyright" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.28" },
    { name = "keyring", specifier = ">=25.0" },
    { name = "mlx-whisper", marker = "platform_machine == 'arm64' and sys_platform == 'darwin' and extra == 'transcripts'", specifier = ">=0.4.3" },
    { name = "yt-dlp", marker = "extra == 'transcripts'", specifier = ">=2025.9.26" },
]
provides-extras = ["transcripts"]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1" },
    { name = "pytest", specifier = ">=8.0" },
]

